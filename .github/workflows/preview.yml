name: Publish review preview

# Publication and later marker removal each require the owner's approval.
# No automatic publication on push.
on:
  workflow_dispatch:
    inputs:
      with_marker:
        description: Publish the course marker (only with explicit owner approval)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck
      - name: Export one HTML page
        env:
          LANE_MARKER: ${{ inputs.with_marker && secrets.LANE_MARKER || '' }}
          WITH_MARKER: ${{ inputs.with_marker }}
        run: |
          if [ "$WITH_MARKER" = true ] && [ -z "$LANE_MARKER" ]; then
            echo "The LANE_MARKER repository secret is missing." >&2
            exit 1
          fi
          pnpm preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .preview
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove the temporary deployment artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
